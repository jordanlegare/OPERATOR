name: Hermes journal integration CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hermes-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile all targets
        run: cargo check --all-targets
      - name: Test Hermes inbox bridge
        run: cargo test hermes_bridge::tests
      - name: Test journal storage compatibility
        run: cargo test storage::terminal_output_filter_tests
