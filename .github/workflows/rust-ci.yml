name: Hermes journal integration CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hermes-journal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: operator
          POSTGRES_PASSWORD: operator
          POSTGRES_DB: operator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operator -d operator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPERATOR_TEST_DATABASE_URL: postgres://operator:operator@localhost:5432/operator?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile all targets
        run: cargo check --all-targets
      - name: Test full-text journal search
        run: cargo test app::tests::search_
      - name: Test PostgreSQL search workspace state
        run: |
          cargo test app::tests::postgres_search
          cargo test app::tests::ranked_search_results_keep_database_order
      - name: Test PostgreSQL search grammar
        run: cargo test postgres::tests::search_parser
      - name: Test Hermes answer review state and socket
        run: |
          cargo test app::tests::review_
          cargo test hermes_review::tests
      - name: Test Hermes response-review plugin
        run: |
          python3 -m py_compile contrib/hermes/operator-review/__init__.py
          python3 -m unittest discover -s contrib/hermes/operator-review -p 'test_*.py'
      - name: Test OPERATOR path migration
        run: cargo test paths::tests
      - name: Test Hermes inbox bridge
        run: cargo test hermes_bridge::tests
      - name: Test SSH session identity and Bash workspace command audit
        run: |
          cargo test audit::tests
          cargo test shell::tests
      - name: Test Hermes conversation grouping and stream persistence
        run: |
          cargo test conversations::tests
          cargo test hermes_stream_delta_tests
          cargo test hermes_bridge::tool_event_tests
      - name: Smoke-test Hermes shell hook
        run: |
          sh -n contrib/hermes/hooks/operator-capture
          python3 -m py_compile contrib/hermes/hooks/operator-capture.py
          inbox="$(mktemp -d)"
          printf '%s' '{"hook_event_name":"pre_llm_call","session_id":"ci-session","extra":{"turn_id":"ci-turn","user_message":"capture smoke test","conversation_history":[{"role":"system","content":"SYSTEM MUST NOT BE RECORDED"},{"role":"user","content":"earlier prompt"},{"role":"assistant","content":"earlier answer"},{"role":"tool","name":"terminal","content":"api_key=topsecret"}]}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"post_llm_call","session_id":"ci-session","extra":{"turn_id":"ci-turn","assistant_response":"captured answer"}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_stream_start","session_id":"ci-session","extra":{"turn_id":"ci-turn","iteration":0}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_stream_delta","session_id":"ci-session","extra":{"turn_id":"ci-turn","iteration":0,"kind":"text","delta":" "}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_stream_end","session_id":"ci-session","extra":{"turn_id":"ci-turn","iteration":0,"finished":true}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_interim_message","session_id":"ci-session","extra":{"turn_id":"ci-turn","text":"Interim status update"}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_session_start","session_id":"ci-session"}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_session_end","session_id":"ci-session","extra":{"completed":true,"interrupted":false,"turn_exit_reason":"completed"}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_session_finalize","session_id":"ci-session","extra":{"reason":"normal_exit"}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"on_session_reset","session_id":"ci-session","extra":{"reason":"new_conversation"}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"post_compaction","session_id":"ci-session-v2","extra":{"old_session_id":"ci-session","kind":"summarize","reason":"manual","before_tokens":900,"after_tokens":300}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          printf '%s' '{"hook_event_name":"pre_llm_call","session_id":"ci-session","extra":{"turn_id":"ci-turn-2","user_message":"second turn","conversation_history":[{"role":"user","content":"earlier prompt"},{"role":"assistant","content":"earlier answer"},{"role":"user","content":"new message"}]}}' \
            | OPERATOR_HERMES_INBOX="$inbox" python3 contrib/hermes/hooks/operator-capture.py
          python3 - "$inbox" <<'PY'
          import json
          import pathlib
          import sys

          ready = pathlib.Path(sys.argv[1]) / "ready"
          events = [json.loads(path.read_text()) for path in sorted(ready.glob("*.json"))]
          by_kind = {event["kind"]: event for event in events}
          assert set(by_kind) == {
              "hermes_user", "hermes_assistant", "hermes_stream_start",
              "hermes_stream_delta", "hermes_stream_end", "hermes_history",
              "hermes_interim", "hermes_session"
          }
          history_events = [event for event in events if event["kind"] == "hermes_history"]
          assert len(history_events) == 1, "history snapshot must be emitted once per session"
          history = history_events[0]["text"]
          assert "earlier prompt" in history and "earlier answer" in history
          assert "SYSTEM MUST NOT BE RECORDED" not in history
          assert "api_key=[REDACTED]" in history
          assert by_kind["hermes_interim"]["text"] == "Interim status update"
          assert sum(event["kind"] == "hermes_session" for event in events) == 5
          compacted = next(event for event in events if event["text"].startswith("Hermes conversation context compacted"))
          assert compacted["session_id"] == "ci-session-v2"
          assert compacted["old_session_id"] == "ci-session"
          assert "before_tokens: 900" in compacted["text"] and "after_tokens: 300" in compacted["text"]
          user_events = [event for event in events if event["kind"] == "hermes_user"]
          assert any(event["text"] == "capture smoke test" for event in user_events)
          assert any(event["text"] == "second turn" for event in user_events)
          first_user = next(event for event in user_events if event["text"] == "capture smoke test")
          assert by_kind["hermes_assistant"]["text"] == "captured answer"
          assert first_user["event_id"] != by_kind["hermes_assistant"]["event_id"]
          delta = by_kind["hermes_stream_delta"]
          assert delta["text"] == " "
          assert delta["session_id"] == "ci-session"
          assert delta["conversation_id"] is None
          assert delta["turn_id"] == "ci-turn"
          assert delta["iteration"] == 0
          PY
      - name: Test original Hermes prompt fan-out
        run: python3 -m unittest discover -s contrib/hermes -p 'test_*.py'
      - name: Test journal storage and cross-terminal synchronization
        run: "cargo test storage::"
      - name: Test Restricted Access splash layouts
        run: cargo test access_splash_tests
      - name: Test PostgreSQL journal, indexed search, and live notifications
        run: cargo test postgres::tests::postgres_index_and_live_notifications -- --nocapture
