[package]
name = "operator"
version = "0.1.0"
edition = "2021"
description = "An unwrapped, append-only terminal note stream with full-cache search"
license = "CC0-1.0"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["crossterm", "unstable-rendered-line-info"] }
portable-pty = "0.9.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
unicode-width = "0.2"
