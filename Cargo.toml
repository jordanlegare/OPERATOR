[package]
name = "streenote"
version = "0.1.0"
edition = "2021"
description = "An unwrapped, append-only terminal note stream with full-cache search"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["crossterm"] }
portable-pty = "0.9.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
